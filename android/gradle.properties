# 3072M could not be reserved on the build machine (see hs_err_pid*.log:
# "Native memory allocation (mmap) failed ... G1 virtual space"). 2 GB
# builds this project comfortably; raise it again only if you see real
# Java heap OOMs rather than reservation failures.
org.gradle.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=512M -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.configureondemand=false
org.gradle.workers.max=1
kotlin.incremental=false
android.useAndroidX=true
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
